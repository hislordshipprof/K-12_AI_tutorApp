name: Secrets Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    name: Block secrets in diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for common secret patterns
        run: |
          # Get added lines in this commit/PR diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}..HEAD -- ':!*.example' ':!docs/**' > /tmp/diff.txt
          else
            git diff HEAD~1..HEAD -- ':!*.example' ':!docs/**' > /tmp/diff.txt
          fi
          if grep -E "^\+.*(AIza[0-9A-Za-z_-]{35}|sk-[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16})" /tmp/diff.txt; then
            echo "::error::Possible secret detected in diff. Rotate the leaked key and remove it from the commit."
            exit 1
          fi
          echo "✓ No common secret patterns found."
