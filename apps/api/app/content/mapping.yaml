# AP CED → OpenStax section map
# ---------------------------------------------------------------------------
# Keys are topic slugs in the form `<course-slug>.unit-<N>.<topic-slug>`.
# Values list OpenStax book section URLs. The extractor resolves each URL to
# a fetchable page via `sources.py`.
#
# IMPORTANT: every entry MUST be a *full section slug* (e.g.
# ``16-1-hookes-law-stress-and-strain-revisited``) — bare chapter anchors
# like ``ch-16`` do NOT resolve to an OpenStax reader page. The B1 work
# stored half-anchors (``16-1``); B3 replaced them with the live slugs
# below, verified against the OpenStax 2026 reader.
#
# Books used (all CC BY 4.0):
#   - openstax/college-physics-2e  →  AP Physics 1
#   - openstax/calculus-volume-1   →  AP Calc BC (limits, derivatives, integrals)
#   - openstax/calculus-volume-2   →  AP Calc BC (integration techniques, series)
#   - openstax/biology-2e          →  AP Biology
#
# Data, not code — curriculum updates don't require redeploys. B2's generator
# reads this file at runtime.

